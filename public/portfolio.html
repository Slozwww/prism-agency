<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — PRISM AGENCY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Portfolio Grid ── */
        .portfolio-hero {
            padding: 120px 0 60px;
            text-align: center;
        }

        .portfolio-hero h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            color: #fff;
            letter-spacing: 4px;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .portfolio-hero h2 span {
            color: #FF0000;
            text-shadow: 0 0 20px rgba(255,0,0,0.6);
        }

        .portfolio-hero p {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            margin-bottom: 60px;
        }

        /* ── Filter Tabs ── */
        .portfolio-filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: #FF0000;
            color: #FF0000;
            background: rgba(255,0,0,0.08);
            box-shadow: 0 0 15px rgba(255,0,0,0.2);
        }

        /* ── Grid ── */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            padding-bottom: 100px;
        }

        /* ── Card ── */
        .portfolio-card {
            position: relative;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .portfolio-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,0,0,0.4);
            box-shadow: 0 20px 60px rgba(255,0,0,0.15);
        }

        /* Screenshot container */
        .card-preview {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #0a0a0a;
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.5s ease;
            display: block;
        }

        .portfolio-card:hover .card-preview img {
            transform: scale(1.04);
        }

        /* Overlay on hover */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .portfolio-card:hover .card-overlay {
            opacity: 1;
        }

        .overlay-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border: 1px solid #FF0000;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-decoration: none;
            background: rgba(255,0,0,0.15);
            border-radius: 2px;
            transition: background 0.2s;
        }

        .overlay-btn:hover {
            background: rgba(255,0,0,0.35);
        }

        .overlay-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Card info */
        .card-info {
            padding: 20px 22px;
        }

        .card-tag {
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            color: #FF0000;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
        }

        /* Loading state for screenshots */
        .card-preview.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0000 100%);
        }

        .placeholder-icon {
            font-size: 2.5rem;
            opacity: 0.4;
        }

        .placeholder-url {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            font-family: 'Inter', sans-serif;
        }

        /* ── Add project card ── */
        .add-card {
            border: 1px dashed rgba(255,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 340px;
            gap: 16px;
            cursor: default;
            background: rgba(255,0,0,0.02);
        }

        .add-card-icon {
            width: 56px;
            height: 56px;
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: rgba(255,0,0,0.4);
        }

        .add-card p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.25);
            text-align: center;
        }

        /* ── Stats bar ── */
        .portfolio-stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            padding: 40px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 60px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #FF0000;
            text-shadow: 0 0 20px rgba(255,0,0,0.4);
        }

        .stat-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
            .portfolio-stats {
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Scroll Progress -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Grid Background -->
    <div class="grid-background"></div>

    <div class="container">
        <!-- Navigation -->
        <nav>
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(10, 15)">
                        <path d="M 15 8 L 23 12 L 23 20 L 15 24 L 7 20 L 7 12 Z"
                              stroke="url(#redGradient)" stroke-width="2.5" fill="none"
                              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                        <path d="M 15 11 L 11 18 L 19 18 Z" fill="url(#redGradient)" filter="url(#glow)"/>
                        <circle cx="15" cy="16" r="1.5" fill="#FFFFFF" opacity="0.9" filter="url(#glow)"/>
                        <line x1="15" y1="8" x2="15" y2="11" stroke="#FF0000" stroke-width="1.5" opacity="0.7"/>
                        <line x1="15" y1="18" x2="15" y2="24" stroke="#FF0000" stroke-width="1.5" opacity="0.7"/>
                    </g>
                    <text x="45" y="28" font-family="Orbitron, sans-serif" font-size="22" font-weight="900"
                          fill="#FF0000" letter-spacing="3" filter="url(#glow)">PRISM</text>
                    <text x="45" y="44" font-family="Orbitron, sans-serif" font-size="12" font-weight="600"
                          fill="#FFFFFF" letter-spacing="4" opacity="0.9">AGENCY</text>
                </svg>
            </div>
            <div class="menu-toggle" id="menuToggle">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html" class="active">Portfolio</a></li>
                <li><a href="about.html">À propos</a></li>
                <li><a href="quote.html">Devis</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <!-- Hero -->
        <section class="portfolio-hero">
            <h2>NOS <span>RÉALISATIONS</span></h2>
            <p>Découvrez les projets que nous avons conçus et développés</p>

            <!-- Stats -->
            <div class="portfolio-stats">
                <div class="stat-item">
                    <div class="stat-number" id="projectCount">0</div>
                    <div class="stat-label">PROJETS</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">CLIENTS SATISFAITS</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">2026</div>
                    <div class="stat-label">DEPUIS</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="portfolio-filters">
                <button class="filter-btn active" data-filter="all">TOUS</button>
                <button class="filter-btn" data-filter="site-vitrine">SITE VITRINE</button>
                <button class="filter-btn" data-filter="e-commerce">E-COMMERCE</button>
                <button class="filter-btn" data-filter="landing-page">LANDING PAGE</button>
                <button class="filter-btn" data-filter="application">APPLICATION</button>
            </div>
        </section>

        <!-- Portfolio Grid -->
        <div class="portfolio-grid" id="portfolioGrid">
            <!-- Les cartes sont générées par JavaScript -->
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-logo">PRISM AGENCY © 2026</div>
            <div class="footer-social">
                <a href="#">Instagram</a>
                <a href="#">LinkedIn</a>
                <a href="#">Behance</a>
                <a href="#">Twitter</a>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        // ── Données des projets ──────────────────────────────────────────
        // Pour ajouter un projet : copie un objet et remplis les champs
        const projects = [
            // Exemple — remplace par tes vrais projets :
            // {
            //     title: "Nom du Site",
            //     url: "https://monsite.com",
            //     tag: "site-vitrine",         // site-vitrine | e-commerce | landing-page | application
            //     tagLabel: "SITE VITRINE",
            //     desc: "Description courte du projet."
            // },
        ];

        // ── Génération des cartes ────────────────────────────────────────
        function getScreenshotUrl(url) {
            // API gratuite de screenshot
            return `https://api.screenshotone.com/take?url=${encodeURIComponent(url)}&viewport_width=1280&viewport_height=800&format=jpg&image_quality=80&access_key=free`;
        }

        function createCard(project) {
            const screenshotUrl = `https://image.thum.io/get/width/680/crop/420/${encodeURIComponent(project.url)}`;

            return `
            <div class="portfolio-card" data-tag="${project.tag}">
                <div class="card-preview">
                    <img
                        src="${screenshotUrl}"
                        alt="${project.title}"
                        loading="lazy"
                        onerror="this.parentElement.innerHTML='<div class=\\'preview-placeholder\\'><div class=\\'placeholder-icon\\'>🌐</div><div class=\\'placeholder-url\\'>${project.url}</div></div>'"
                    />
                    <div class="card-overlay">
                        <a href="${project.url}" target="_blank" rel="noopener" class="overlay-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                                <polyline points="15 3 21 3 21 9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                            VOIR LE SITE
                        </a>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-tag">${project.tagLabel}</div>
                    <div class="card-title">${project.title}</div>
                    <div class="card-desc">${project.desc}</div>
                </div>
            </div>`;
        }

        function renderGrid(filter = 'all') {
            const grid = document.getElementById('portfolioGrid');
            const filtered = filter === 'all' ? projects : projects.filter(p => p.tag === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `
                <div class="add-card portfolio-card" style="grid-column: 1 / -1; min-height: 260px;">
                    <div class="add-card-icon">+</div>
                    <p>TES PROJETS<br>APPARAÎTRONT ICI</p>
                    <p style="font-family:Inter,sans-serif;font-size:0.8rem;color:rgba(255,255,255,0.2);letter-spacing:0;">
                        Ajoute tes liens dans le tableau <code>projects</code> du fichier portfolio.html
                    </p>
                </div>`;
            } else {
                grid.innerHTML = filtered.map(createCard).join('');
            }

            // Compteur
            document.getElementById('projectCount').textContent = projects.length;
        }

        // ── Filtres ──────────────────────────────────────────────────────
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGrid(btn.dataset.filter);
            });
        });

        // ── Compteur animé ───────────────────────────────────────────────
        function animateCount(el, target) {
            let count = 0;
            const step = Math.max(1, Math.floor(target / 30));
            const timer = setInterval(() => {
                count = Math.min(count + step, target);
                el.textContent = count;
                if (count >= target) clearInterval(timer);
            }, 40);
        }

        // ── Init ─────────────────────────────────────────────────────────
        renderGrid();
        animateCount(document.getElementById('projectCount'), projects.length);
    </script>
</body>
</html>
